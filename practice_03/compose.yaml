name: shop-practice

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: secret   # пароль суперкористувача postgres
      POSTGRES_DB: shop                 # база, яку контейнер створює під час першого запуску
    ports:
      - "5433:5432"                     # порт 5433 на компʼютері веде на порт 5432 у контейнері
    volumes:
      - pgdata:/var/lib/postgresql      # дані бази зберігаються між перезапусками контейнера
      - ./data:/data                    # папку data видно в контейнері як /data

volumes:
  pgdata: